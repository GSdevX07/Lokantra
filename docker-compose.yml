services:
  lokantra:
    image: ghcr.io/lokantra/lokantra:latest
    # Mirror for faster pulling (replace address above if slow)
    # image: ghcr.nju.edu.cn/lokantra/lokantra:latest
    container_name: lokantra
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
