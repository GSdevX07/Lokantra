name: Auto Deploy to Azure VM

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Deploy to Azure Server
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.AZURE_VM_PASSWORD }}" ] && [ -z "${{ secrets.AZURE_SSH_KEY }}" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::AZURE_VM_PASSWORD or AZURE_SSH_KEY secret is not set in GitHub repository settings. Skipping auto-deploy."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: SSH and Deploy to Azure VM
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST || '172.198.129.132' }}
          username: ${{ secrets.AZURE_VM_USERNAME || 'Lokantra' }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          port: 22
          script: |
            # Source environment
            export PATH="$HOME/.local/bin:/usr/local/bin:/usr/bin:$PATH"
            source $HOME/.bashrc 2>/dev/null || true

            echo "=== Pulling latest changes from GitHub ==="
            cd /home/Lokantra/Lokantra
            git pull

            echo "=== Syncing Backend dependencies with uv ==="
            cd /home/Lokantra/Lokantra/backend
            uv sync

            echo "=== Installing Frontend dependencies ==="
            cd /home/Lokantra/Lokantra
            npm install
            cd frontend
            npm install

            echo "=== Restarting all PM2 services ==="
            pm2 restart all

            echo "=== Deployment Succeeded! ==="
